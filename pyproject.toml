[project]
name = "micro-mdt"
version = "0.2.0"
description = "Micro-MDT × Medical TTC — multi-agent medical workflow + AFLOW-style automated search."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Micro-MDT × Medical TTC Contributors" }]

# Core (original Micro-MDT) has no external runtime deps — it ships with a
# deterministic MockProvider and uses only urllib for the OpenAI-compatible
# endpoint. The Medical TTC experiments require HuggingFace datasets.
dependencies = []

[project.optional-dependencies]
medical-ttc = [
    "datasets>=3.0",
    "huggingface_hub>=0.20",
]

[project.scripts]
micro-mdt = "cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
